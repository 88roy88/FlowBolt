name: Alembic Validate

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  alembic:
    name: Migration tree & upgrade
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flow44
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIB_DB_USER: postgres
      AIB_DB_PASSWORD: postgres
      AIB_DB_HOST: localhost
      AIB_DB_PORT: 5432
      AIB_DB_NAME: flow44
      # Dummy values to satisfy required-field validation; unrelated to migrations.
      AIB_AUTH_JWT_PUBLIC_KEY: alembic-ci-not-used
      AIB_S3_ENDPOINT_URL: http://localhost:9000
      AIB_S3_ACCESS_KEY: alembic-ci-not-used
      AIB_S3_SECRET_KEY: alembic-ci-not-used
      AIB_S3_BUCKET_NAME: alembic-ci-not-used
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/uv-setup

      - name: Check for a single migration head
        working-directory: backend
        run: |
          HEADS=$(uv run --no-sync alembic heads)
          COUNT=$(echo "$HEADS" | grep -c .)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Alembic migration tree has $COUNT heads (expected 1) - branches have diverged:"
            echo "$HEADS"
            exit 1
          fi

      - name: Upgrade to head against Postgres
        working-directory: backend
        run: uv run --no-sync alembic upgrade head

      - name: Check for model/migration drift
        working-directory: backend
        run: uv run --no-sync alembic check
